services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mooc}
      POSTGRES_USER: ${POSTGRES_USER:-mooc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mooc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mooc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # El navegador sube y descarga objetos directamente contra MinIO, asi
      # que es un origen cruzado respecto al frontend. Sin esto, el PUT
      # prefirmado y las peticiones de hls.js al manifiesto fallan en el
      # preflight. Es el valor por defecto de MinIO; va explicito para que se
      # vea que en produccion hay que restringirlo al origen real.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:stable
    environment:
      # Se salta el freshclam del arranque en local: descargar la base de
      # firmas tarda minutos y la imagen ya la trae. En un despliegue real
      # esto va en true, porque una base de firmas vieja no protege.
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-true}
    healthcheck:
      # clamd tarda en cargar las firmas; hasta que responda PING no acepta
      # escaneos, y la API lo necesita para aceptar cargas.
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Colector de OpenTelemetry. Recibe trazas y metricas de la API y de los
  # workers, y las deja en su propio log para poder leerlas en la demostracion
  # sin montar un backend completo. En produccion se apunta a Jaeger, Tempo o
  # lo que se use.
  otel:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ./backend
      target: api
    environment:
      APP_ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-mooc}:${POSTGRES_PASSWORD:-mooc}@postgres:5432/${POSTGRES_DB:-mooc}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_BUCKET: ${S3_BUCKET:-mooc}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_USE_SSL: "false"
      # Host por el que el NAVEGADOR alcanza MinIO. "minio:9000" solo resuelve
      # dentro de la red del compose, y la firma SigV4 cubre el Host: si se
      # firma contra el host interno, la URL llega al navegador y muere con
      # ERR_NAME_NOT_RESOLVED. Tiene que coincidir con el puerto publicado
      # arriba (MINIO_API_PORT).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:${MINIO_API_PORT:-9100}}
      S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL:-false}
      # Base publica desde la que el reproductor lee el HLS. En produccion es
      # el CDN; vacia en local, donde los objetos se firman uno a uno.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Demonio ClamAV que escanea el material subido. Si se deja vacia, la API
      # usa el escaner de desarrollo (reconoce EICAR y ejecutables) y en
      # APP_ENV=production se niega a arrancar.
      ANTIMALWARE_ADDR: ${ANTIMALWARE_ADDR-clamav:3310}
      # Observabilidad. Vacia desactiva la exportacion: sin colector, un
      # arranque que falla por eso seria peor que no tener trazas.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-otel:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      APP_VERSION: ${APP_VERSION:-dev}
      # Redes desde las que se acepta X-Forwarded-For. La red por defecto del
      # compose esta en 172.16/12; sin declararla, todas las peticiones
      # parecerian venir del proxy y un solo abusador agotaria el limite de
      # tasa de todos. Declarar de mas seria peor: cualquiera podria elegir su
      # direccion y esquivar el limite.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@mooc.local
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # La API no publica puerto: lo hace el proxy, que reparte entre las
    # instancias. Publicar 8080 aqui impedia `--scale api=N`, porque la segunda
    # instancia chocaba con el puerto de la primera.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-mooc}:${POSTGRES_PASSWORD:-mooc}@postgres:5432/${POSTGRES_DB:-mooc}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_BUCKET: ${S3_BUCKET:-mooc}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_USE_SSL: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-otel:4318}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # Proxy inverso delante de la API. Existe para que `docker compose up
  # --scale api=3` funcione: reparte entre las instancias por el DNS interno
  # del compose, que devuelve todas las direcciones del servicio.
  #
  # Tambien es lo que hace demostrable que la API no guarda estado local: las
  # peticiones de una misma sesion caen en instancias distintas y todo sigue
  # funcionando, porque la sesion vive en Redis y la verdad en Postgres.
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
