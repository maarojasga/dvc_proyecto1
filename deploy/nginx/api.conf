# Proxy de entrada a la API.
#
# Existe por un requisito concreto del enunciado: el criterio "Arquitectura y
# despliegue" exige escalamiento a múltiples instancias. Mientras la API
# publicaba el puerto 8080 directamente en el host, `docker compose up
# --scale api=3` fallaba por choque de puertos, así que el requisito no podía
# demostrarse aunque la API ya fuera sin estado. Ahora el puerto lo publica
# este proxy y las instancias quedan detrás.

server {
    listen 8080;
    server_name _;

    # El DNS interno de Docker devuelve una dirección por réplica. Se resuelve
    # en cada petición, y no una vez al arrancar, porque `--scale api=N` añade
    # y quita réplicas con nginx ya en marcha: un upstream estático se
    # quedaría hablando con las instancias del arranque e ignorando las
    # nuevas. Ese es justamente el escenario que hay que demostrar.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8080;

    # Las subidas van directas al almacén de objetos con URL prefirmada, así
    # que por aquí solo pasa JSON. El límite está bajo a propósito: un cuerpo
    # de megabytes contra la API es un error o un abuso, no un caso legítimo.
    client_max_body_size 4m;

    location / {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Sin esto, el límite de tasa por IP vería siempre la dirección del
        # proxy y contaría a todos los usuarios como uno solo: diez intentos
        # de login por minuto para el mundo entero. La API lee la IP real de
        # X-Forwarded-For.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # La sonda no debe consumir un hueco del proxy ni aparecer en las métricas
    # de tráfico: responde aquí.
    location = /healthz-proxy {
        access_log off;
        return 200 "ok\n";
    }
}
