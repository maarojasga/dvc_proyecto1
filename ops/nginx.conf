# Proxy inverso delante de la API.
#
# Su razón de ser es el escalamiento: con la API publicando el puerto 8080
# directamente, `docker compose up --scale api=3` falla porque la segunda
# instancia choca con el puerto de la primera. Con el proxy delante, la API
# solo expone el puerto en la red interna y las instancias se reparten aquí.

# resolver de Docker. Hace falta para que el reparto sea dinámico: sin esto,
# nginx resuelve "api" una vez al arrancar y se queda con la primera dirección,
# de modo que escalar no cambiaría nada.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # El cuerpo de una subida no pasa por aquí —el navegador sube directo al
    # almacén— pero sí pasan los JSON de autoría, que pueden traer Markdown
    # largo.
    client_max_body_size 2m;

    # Las respuestas de la API son JSON pequeño; el búfer por defecto sobra.
    proxy_http_version 1.1;

    location / {
        # La variable en proxy_pass es lo que fuerza a nginx a resolver "api"
        # en cada petición en lugar de al arrancar. El DNS del compose devuelve
        # todas las instancias del servicio, así que el reparto sale de ahí.
        set $destino http://api:8080;
        proxy_pass $destino;

        proxy_set_header Host $host;
        # La API usa la IP del cliente para el límite de tasa y para la
        # bitácora. Sin reenviarla, todas las peticiones parecerían venir del
        # proxy y un solo abusador agotaría el límite de todos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un poco más de margen que el valor por defecto: cerrar una carga
        # multipart incluye calcular el SHA-256 del objeto y escanearlo.
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
